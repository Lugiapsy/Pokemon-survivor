<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype C · Vitrine</title>
<link rel="stylesheet" href="common.css">
<style>
body { min-height:100vh; background:
  radial-gradient(ellipse at 50% 58%, rgba(var(--ca, 114,201,78),.28), transparent 38%),
  linear-gradient(180deg, #1d3a4a 0%, #24503a 46%, #1a3a26 47%, #12261a 100%); transition:background .3s; }
.hills { position:fixed; inset:auto 0 30% 0; height:30%; pointer-events:none; opacity:.55;
  background:radial-gradient(ellipse 30% 60% at 10% 100%, #1f4630, transparent 70%), radial-gradient(ellipse 40% 70% at 85% 100%, #1b402c, transparent 70%), radial-gradient(ellipse 25% 50% at 55% 100%, #22503a, transparent 70%); }
.top { position:relative; display:flex; justify-content:space-between; align-items:center; padding:14px 22px; }
.back { font:700 15px var(--display); background:rgba(0,0,0,.45); border:2px solid rgba(255,255,255,.25); border-radius:8px; padding:7px 14px; }
.money { font:16px var(--num); color:var(--accent); text-shadow:0 2px 0 #000; }
.stage { position:relative; display:grid; grid-template-columns:330px 1fr 380px; gap:18px; align-items:start; padding:0 22px; }
.win { background:#1e2b24; border:3px solid #5d6e60; border-radius:6px; box-shadow:inset 0 0 0 2px #0e1612, 0 10px 30px rgba(0,0,0,.4); }
.win h3 { margin:0; padding:10px 14px; font:700 18px var(--display); letter-spacing:.06em; text-transform:uppercase; border-bottom:2px solid #3c4a40; }
.grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; padding:12px; max-height:470px; overflow:auto; }
.slot { position:relative; aspect-ratio:1 / 1.12; background:#2c3b31; border:2px solid #5d6e60; border-radius:4px; outline:none; overflow:hidden; }
.slot canvas { width:100%; height:78%; }
.slot b { position:absolute; left:0; right:0; bottom:0; padding:2px 0 3px; text-align:center; font:700 12px var(--display); background:#18221c; border-top:2px solid #5d6e60; }
.slot.sel { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent), 0 0 18px rgba(246,200,69,.45); } .slot.sel b { background:var(--accent); color:#1a1a1a; border-color:var(--accent); }
.slot.lk canvas { opacity:.85; }
.show { position:relative; height:520px; }
.show canvas { position:absolute; left:50%; top:10px; transform:translateX(-50%); width:420px; height:420px; z-index:2; }
.ped { position:absolute; left:50%; top:356px; width:250px; height:56px; transform:translateX(-50%); border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%, #4d7058, #22382a 70%); border:3px solid #6b8a72; box-shadow:0 10px 0 #142218, 0 0 60px rgba(var(--ca),.35); }
.aura { position:absolute; left:50%; top:120px; width:300px; height:300px; transform:translateX(-50%); border-radius:50%; background:radial-gradient(circle, rgba(var(--ca),.45), transparent 65%); animation:pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform:translateX(-50%) scale(1.08); opacity:.75; } }
.show h1 { position:absolute; left:0; right:0; top:432px; margin:0; text-align:center; font:700 40px var(--display); text-shadow:0 4px 0 rgba(0,0,0,.5); }
.show .rl { position:absolute; left:0; right:0; top:484px; text-align:center; font:600 15px var(--body); color:var(--ink-dim); }
.card { padding:16px 18px 18px; }
.head { display:grid; grid-template-columns:84px 1fr; gap:14px; align-items:center; }
.head .pf { width:84px; height:84px; background:#2c3b31; border:2px solid #5d6e60; border-radius:4px; }
.head h2 { margin:0; font:700 26px var(--display); }
.head p { margin:4px 0 0; font:600 14px var(--body); color:var(--ink-dim); }
.it { display:grid; grid-template-columns:52px 1fr; gap:12px; margin-top:16px; align-items:start; }
.it .ic { width:52px; height:52px; border:2px solid #5d6e60; border-radius:4px; display:grid; place-items:center; font-size:24px; background:linear-gradient(135deg, var(--c, #555), #1e2b24); }
.it h4 { margin:0 0 3px; font:700 18px var(--display); color:#ffe066; }
.it p { margin:0; font:500 14px var(--body); line-height:1.4; }
.evos { display:flex; align-items:center; gap:4px; margin-top:16px; padding:8px; background:#18221c; border:2px solid #3c4a40; border-radius:4px; }
.evos canvas { width:52px; height:52px; } .evos span { font:9px var(--num); color:var(--ink-dim); }
.confirm { display:block; width:72%; margin:20px auto 0; font:700 20px var(--display); letter-spacing:.06em; text-transform:uppercase; color:#fff; background:#2f7fd8; border:3px solid #9fd0ff; border-radius:8px; padding:11px; box-shadow:0 5px 0 #1c4f8c; }
.confirm:hover { filter:brightness(1.1); }
.lockMsg { margin-top:16px; font:600 15px var(--body); color:var(--accent); line-height:1.4; }
.bar { position:fixed; left:0; right:0; bottom:0; display:grid; grid-template-columns:repeat(6, 1fr); gap:18px; padding:14px 28px 16px; background:rgba(8,14,10,.88); border-top:3px solid #5d6e60; }
.st { font:700 15px var(--display); }
.st .l { display:flex; justify-content:space-between; } .st .l i { font-style:normal; color:var(--accent); margin-right:6px; } .st .v { font:11px var(--num); }
.st .bb { height:9px; margin-top:6px; background:#2c3b31; border-radius:2px; overflow:hidden; } .st .bb b { display:block; height:100%; background:linear-gradient(90deg, #4fb2e8, #8fe0ff); transition:width .25s; }
.st.up .v { color:#7ef07a; } .st.up .bb b { background:linear-gradient(90deg, #4fc85a, #a6f0a0); }
@media (max-width:1200px) { .stage { grid-template-columns:1fr 1fr; } .show { grid-column:1 / -1; order:-1; height:440px; } .show canvas { width:340px; height:340px; } .ped { top:290px; } .show h1 { top:356px; } .show .rl { top:404px; } .aura { top:90px; } }
@media (max-width:700px) { .stage { grid-template-columns:1fr; padding-bottom:180px; } .bar { grid-template-columns:repeat(3, 1fr); gap:10px; } }
</style>
</head>
<body>
<div class="hills"></div>
<div class="top"><button class="back" id="back" type="button">← Menu</button><span class="money">₽ 1 625</span></div>
<div class="stage">
  <section class="win"><h3>Sélection du Pokémon</h3><div class="grid" id="grid"></div></section>
  <section class="show"><div class="aura"></div><div class="ped"></div><canvas id="big" width="140" height="140"></canvas><h1 id="bigName"></h1><div class="rl" id="bigRole"></div></section>
  <section class="win card" id="card"></section>
</div>
<div class="bar" id="bar"></div>
<nav class="proto-nav" style="bottom:96px"><a href="index.html">Prototypes</a><a href="a-vampire.html">A</a><a href="b-temtem.html">B</a><a class="on" href="c-vitrine.html">C</a></nav>
<script src="../../src/assets/sprites.js"></script>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
let cur = STARTERS[0], since = 0;
const cells = STARTERS.map(s => {
  const lk = isLocked(s), c = document.createElement("div"); c.className = "slot" + (lk ? " lk" : "");
  c.innerHTML = `<b>${lk ? "???" : s.names[0]}</b>`;
  canvasFor(c, 72, 64, (g, t) => drawMon(g, s.dex[0], 36, 58, 1.5, 0, t, s === cur && !lk, lk));
  $("grid").appendChild(c); return c;
});
// grand Pokémon : marche sur place et se tourne lentement (bas, bas-droite, droite… un tour complet)
canvasFor($("big"), 140, 140, (g, t) => { const lk = isLocked(cur), row = lk ? 0 : [0, 1, 2, 1, 0, 7, 6, 7][Math.floor((t - since) / 1.4) % 8]; drawMon(g, cur.dex[0], 70, 124, 2, row, t, !lk, lk); });
function show(s) {
  cur = s; since = performance.now() / 1000; const lk = isLocked(s), col = TYPE_COLORS[s.type];
  document.body.style.setProperty("--ca", rgb(lk ? "#6a6a6a" : col));
  $("bigName").textContent = lk ? "???" : s.names[0];
  $("bigRole").innerHTML = lk ? "Pokémon verrouillé" : `<span class="chip" style="--c:${col}">${TYPE_NAMES[s.type]}</span> · ${s.role}`;
  $("bar").innerHTML = stats(s).map(x => `<div class="st${x.up ? " up" : ""}"><div class="l"><span><i>${x.ic}</i>${x.n}</span><span class="v">${lk ? "?" : x.v}</span></div><div class="bb"><b style="width:${lk ? 0 : Math.round(x.f * 100)}%"></b></div></div>`).join("");
  $("card").innerHTML = `<div class="head"><canvas class="pf" id="pf" width="84" height="84"></canvas><div><h2>${lk ? "???" : s.names[0]}</h2><p>${lk ? "Pas encore rencontré" : `Évolution : ${evoText(s)}`}</p></div></div>` + (lk
    ? `<p class="lockMsg">🔒 Succès « ${s.lock[0]} »<br><span style="color:var(--ink)">${s.lock[1]}</span></p>`
    : `<div class="it" style="--c:${col}"><div class="ic">✦</div><div><h4>${s.move}</h4><p>${s.moveDesc}</p></div></div>
       <div class="it"><div class="ic" style="background:linear-gradient(135deg,#e0a02a,#1e2b24)">★</div><div><h4>${s.talent[0]}</h4><p>${s.talent[1]}</p></div></div>
       <div class="evos" id="evos"></div>`) + `<button class="confirm" id="go" type="button">${lk ? "Verrouillé" : "Confirmer"}</button>`;
  canvasFor($("pf"), 84, 84, (g, t) => drawMon(g, s.dex[0], 42, 74, 2, 0, t, false, lk));
  if (!lk) s.dex.forEach((id, k) => { if (k) $("evos").insertAdjacentHTML("beforeend", `<span>N.${k === 1 ? 10 : 22} ›</span>`); canvasFor($("evos").appendChild(document.createElement("canvas")), 52, 52, (g, t) => drawMon(g, id, 26, 46, 1, 0, t, true)); });
  $("go").addEventListener("click", () => pick(s));
}
function pick(s) { isLocked(s) ? toast(`🔒 ${s.lock[0]} : ${s.lock[1]}`) : toast(`<b>${s.names[0]}</b> choisi ! Étape suivante : choix de la carte`); }
gridNav(cells, { onFocus:i => show(STARTERS[i]), onConfirm:i => pick(STARTERS[i]), onBack:() => toast("← Retour au menu d'accueil") });
$("back").addEventListener("click", () => toast("← Retour au menu d'accueil"));
</script>
</body>
</html>
