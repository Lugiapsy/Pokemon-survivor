<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype B · Temtem</title>
<link rel="stylesheet" href="common.css">
<style>
:root { --cyan:#4fd6e8; --deep:#1c2440; --card:#22304c; --edge:#3a5a78; }
body { min-height:100vh; background:
  radial-gradient(ellipse at 20% 30%, rgba(120,70,200,.35), transparent 50%), radial-gradient(ellipse at 85% 75%, rgba(40,120,200,.3), transparent 55%),
  radial-gradient(circle at 50% 50%, #1e1a3e, #0b0a1a 75%); }
body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
  background-image:radial-gradient(1px 1px at 12% 22%, #fff, transparent), radial-gradient(1px 1px at 72% 12%, #fff, transparent), radial-gradient(1px 1px at 40% 80%, #fff, transparent),
  radial-gradient(1.5px 1.5px at 90% 50%, #cfe8ff, transparent), radial-gradient(1px 1px at 25% 65%, #fff, transparent), radial-gradient(1px 1px at 60% 40%, #fff, transparent); }
.title { display:flex; align-items:center; justify-content:center; gap:16px; padding:28px 16px 18px; font:800 clamp(22px, 2.6vw, 32px) var(--body); letter-spacing:.06em; text-transform:uppercase; }
.title::before, .title::after { content:""; height:3px; width:min(22vw, 260px); background:linear-gradient(90deg, transparent, var(--cyan)); border-radius:3px; }
.title::after { transform:scaleX(-1); }
.wrap { display:grid; grid-template-columns:auto minmax(0, 720px); gap:36px; justify-content:center; align-items:start; padding:0 24px 90px; }
.grid { display:grid; grid-template-columns:repeat(4, 118px); gap:12px; }
.card { position:relative; height:156px; border-radius:10px; background:linear-gradient(#26375a, #182238); border:3px solid var(--edge); outline:none; transition:transform .1s, border-color .1s; }
.card canvas { position:absolute; inset:0; width:100%; height:100%; }
.card::after { content:""; position:absolute; left:50%; bottom:20px; width:64px; height:12px; transform:translateX(-50%); border-radius:50%; background:rgba(0,0,0,.4); }
.card .t { position:absolute; left:8px; top:7px; width:10px; height:10px; border-radius:50%; background:var(--c); box-shadow:0 0 6px var(--c); z-index:2; }
.card.lk { background:linear-gradient(#1a2236, #121827); } .card.lk::after { display:none; }
.card.lk .pad { position:absolute; inset:0; display:grid; place-items:center; }
.card.lk .pad span { width:62px; height:54px; display:grid; place-items:center; font-size:22px; background:#2c3a52; clip-path:polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
.card.sel { border-color:var(--cyan); background:linear-gradient(#3a8fb0, #1d3e62); box-shadow:0 0 0 2px #0b0a1a, 0 0 26px rgba(79,214,232,.55); transform:translateY(-3px); }
.card.sel::before { content:"▲"; position:absolute; left:50%; bottom:-4px; transform:translateX(-50%); color:#cfefff; font-size:16px; z-index:3; }
.card.lk.sel { background:linear-gradient(#2a3a56, #1a2438); }
.info { position:relative; background:linear-gradient(160deg, #3a4f6e, #2a3a56); border-radius:16px; padding:22px 26px 24px; box-shadow:0 10px 40px rgba(0,0,0,.45);
  clip-path:polygon(0 0, 46% 0, 49% 26px, 100% 26px, 100% 100%, 0 100%); padding-top:30px; }
.info h2 { margin:0; font:800 36px var(--body); }
.portrait { position:absolute; right:22px; top:6px; width:96px; height:96px; border-radius:50%; background:radial-gradient(circle at 40% 35%, rgba(var(--ca),.65), #1a2438 70%); border:3px solid rgba(255,255,255,.15); }
.portrait canvas { width:96px; height:96px; }
.statline { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; margin:14px 0 18px; padding:8px 14px; background:rgba(10,16,30,.45); border-radius:6px; font:800 16px var(--body); }
.statline span i { font-style:normal; color:var(--cyan); margin-right:5px; } .statline .up { color:#7ef07a; } .statline small { color:var(--ink-dim); font-weight:600; font-size:12px; margin-left:2px; }
.box { background:rgba(12,20,36,.5); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
.mv { display:grid; grid-template-columns:62px 1fr; gap:14px; align-items:center; }
.mv .ic { width:62px; height:46px; border-radius:8px; background:linear-gradient(135deg, var(--c), #1a2438); display:grid; place-items:center; font-size:24px; box-shadow:inset 0 0 0 2px rgba(255,255,255,.25); }
.mv h3 { margin:0 0 2px; font:700 18px var(--body); }
.tags { font:700 14px var(--body); color:var(--cyan); margin-bottom:4px; } .tags b { color:var(--accent); }
.mv p, .tal p { margin:0; font:500 15px var(--body); color:#e4ecf6; line-height:1.4; }
.lower { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.tab { display:inline-block; font:700 14px var(--body); background:rgba(12,20,36,.7); border-radius:8px 8px 0 0; padding:6px 14px; margin-left:8px; }
.tal { display:grid; grid-template-columns:56px 1fr; gap:12px; align-items:center; border-top-left-radius:0; }
.tal .ic { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; font-size:24px; background:radial-gradient(circle at 35% 30%, #ffe08a, #e08a2a); }
.evo { text-align:center; border-top-left-radius:0; }
.evo .row { display:flex; justify-content:center; align-items:flex-end; gap:2px; }
.evo canvas { width:60px; height:60px; flex:none; } .evo .ar { font:8px var(--num); color:var(--ink-dim); padding-bottom:22px; white-space:nowrap; }
.lockMsg { margin:16px 0; padding:14px 16px; border-radius:10px; background:rgba(12,20,36,.6); font:600 16px var(--body); color:var(--accent); }
.foot { position:fixed; left:0; right:0; bottom:0; padding:16px 40px; display:flex; gap:30px; background:linear-gradient(transparent, rgba(5,5,15,.85)); }
@media (max-width:1100px) { .wrap { grid-template-columns:1fr; justify-items:center; } .info { width:100%; max-width:720px; } }
@media (max-width:600px) { .grid { grid-template-columns:repeat(3, 1fr); width:100%; } .lower { grid-template-columns:1fr; } .info h2 { font-size:28px; } }
</style>
</head>
<body>
<div class="title">Choix du Pokémon</div>
<div class="wrap">
  <div class="grid" id="grid"></div>
  <section class="info" id="info">
    <div class="portrait"><canvas id="portrait" width="96" height="96"></canvas></div>
    <h2 id="name"></h2>
    <div class="statline" id="statline"></div>
    <div id="body"></div>
  </section>
</div>
<div class="foot keys"><span><kbd>Entrée</kbd>Sélectionner</span><span><kbd>Échap</kbd>Retour</span><span><kbd>A</kbd><kbd>B</kbd>Manette</span></div>
<nav class="proto-nav"><a href="index.html">Prototypes</a><a href="a-vampire.html">A</a><a class="on" href="b-temtem.html">B</a><a href="c-vitrine.html">C</a></nav>
<script src="../../src/assets/sprites.js"></script>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
let cur = STARTERS[0];
const cells = STARTERS.map(s => {
  const lk = isLocked(s), c = document.createElement("div"); c.className = "card" + (lk ? " lk" : ""); c.style.setProperty("--c", TYPE_COLORS[s.type]);
  if (lk) c.innerHTML = `<div class="pad"><span>🔒</span></div>`;
  else { c.innerHTML = `<span class="t"></span>`; canvasFor(c, 118, 156, (g, t) => drawMon(g, s.dex[0], 59, 134, 2, 0, t, s === cur)); }
  $("grid").appendChild(c); return c;
});
canvasFor($("portrait"), 96, 96, (g, t) => drawMon(g, cur.dex[0], 48, 82, 2, 0, t, false, isLocked(cur)));
function show(s) {
  cur = s; const lk = isLocked(s), col = TYPE_COLORS[s.type];
  $("info").style.setProperty("--c", col); $("info").style.setProperty("--ca", rgb(col));
  $("name").innerHTML = lk ? "???" : `${s.names[0]} <span class="chip" style="--c:${col}">${TYPE_NAMES[s.type]}</span>`;
  $("statline").innerHTML = stats(s).map(x => `<span class="${x.up ? "up" : ""}"><i>${x.ic}</i>${lk ? "?" : x.v}<small>${x.n}</small></span>`).join("");
  if (lk) { $("body").innerHTML = `<div class="lockMsg">🔒 Succès « ${s.lock[0]} »<br><span style="color:var(--ink)">${s.lock[1]}</span></div>`; return; }
  $("body").innerHTML = `
    <div class="box mv" style="--c:${col}"><div class="ic">✦</div><div><h3>${s.move}</h3><div class="tags">Départ | <b>${TYPE_NAMES[s.type]}</b> | ${s.role}</div><p>${s.moveDesc}</p></div></div>
    <div class="lower">
      <div><span class="tab">Talent</span><div class="box tal"><div class="ic">★</div><div><h3 style="margin:0 0 2px;font:700 17px var(--body)">${s.talent[0]}</h3><p>${s.talent[1]}</p></div></div></div>
      <div><span class="tab">Évolutions</span><div class="box evo"><div class="row" id="evoRow"></div></div></div>
    </div>`;
  const row = $("evoRow");
  s.dex.forEach((id, k) => {
    if (k) row.insertAdjacentHTML("beforeend", `<span class="ar">N.${k === 1 ? 10 : 22}›</span>`);
    canvasFor(row.appendChild(document.createElement("canvas")), 60, 60, (g, t) => drawMon(g, id, 30, 54, 1, 0, t, true));
  });
  if (s.dex.length === 1) row.insertAdjacentHTML("beforeend", `<span class="ar" style="padding:0 0 22px 8px;text-align:left;font:600 12px var(--body)">${evoText(s)}</span>`);
}
gridNav(cells, { onFocus:i => show(STARTERS[i]), onConfirm:i => { const s = STARTERS[i]; isLocked(s) ? toast(`🔒 ${s.lock[0]} : ${s.lock[1]}`) : toast(`<b>${s.names[0]}</b> choisi ! Étape suivante : choix de la carte`); }, onBack:() => toast("← Retour au menu d'accueil") });
</script>
</body>
</html>
