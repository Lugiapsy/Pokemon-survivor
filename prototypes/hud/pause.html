<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Maquette pause</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&family=Rubik:wght@400;500;600;800&display=swap">
<style>
:root { --ink:#f4f1e4; --dim:#b9c4b0; --gold:#f6c845; --num:"Press Start 2P", monospace; --disp:"Pixelify Sans", monospace; --body:"Rubik", sans-serif; }
html, body { margin:0; width:1600px; height:900px; overflow:hidden; background:#000; font-variant-ligatures:none; }
body { position:relative; color:var(--ink); font-family:var(--body); }
/* la partie en dessous : floutée et assombrie */
.bg { position:absolute; inset:-20px; background:url(hud-b2.png) 20px 20px / 1600px 900px no-repeat; filter:blur(5px) brightness(.42) saturate(.8); }
.veil { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, rgba(10,16,12,.15), rgba(5,8,6,.55)); }
.abs { position:absolute; }
img.px, canvas { image-rendering:pixelated; }
/* stats */
.st .row { display:grid; grid-template-columns:24px 1fr auto; gap:8px; align-items:center; padding:2px 0; font:500 15px var(--body); }
.st .row img { width:22px; height:22px; image-rendering:pixelated; } .st .row .em { width:22px; text-align:center; font-size:15px; }
.st .row .v { font:600 15px var(--body); white-space:nowrap; } .st .row .v small { color:#7ee07a; font-weight:600; margin-left:4px; }
.st .row.up .v { color:var(--gold); } .st .row.off { color:#8a948a; } .st .row.off .v { color:#6a746a; }
.st .grp + .grp { margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,.14); }
/* capacités : niveaux acquis en blanc, à venir en gris */
.mv { display:grid; grid-template-columns:44px 1fr; gap:10px; align-items:start; }
.mv .ic { width:44px; height:44px; border-radius:6px; display:grid; place-items:center; border:2px solid #6a5a34; background:linear-gradient(160deg, var(--t), rgba(10,16,12,.9)); }
.mv .ic canvas { width:32px; height:32px; }
.mv h4 { margin:0 0 3px; font:700 16px var(--body); display:flex; align-items:center; gap:8px; } .mv h4 em { font:9px var(--num); font-style:normal; color:var(--gold); }
.mv ol { margin:0; padding:0; list-style:none; font:500 12.5px/1.35 var(--body); }
.mv li { display:grid; grid-template-columns:30px 1fr; color:#6f7a70; } .mv li b { font:8px/16px var(--num); color:#6f7a70; }
.mv li.on { color:#ffffff; } .mv li.on b { color:var(--gold); }
.mv li.cur { color:#fff; font-weight:600; }
.items { display:flex; flex-wrap:wrap; gap:8px 14px; }
.it { display:flex; align-items:center; gap:7px; font:500 13px var(--body); } .it img { width:28px; height:28px; image-rendering:pixelated; } .it em { font:8px var(--num); color:var(--gold); font-style:normal; }
.btn { font:700 18px var(--disp); color:var(--ink); background:#2a3a30; border:3px solid #6a8a72; border-radius:8px; padding:9px 22px; text-align:center; letter-spacing:.06em; }
.btn.main { background:var(--gold); color:#1a1a1a; border-color:#fff1b8; box-shadow:0 4px 0 #b0661e; }
.btn.red { background:#a8352a; border-color:#ffb08a; }
/* ---- A : Vampire+ ---- */
.A .stats { left:40px; top:60px; width:300px; padding:14px 16px; background:#9aa0a8; color:#1d2230; border:3px solid #5e6470; border-radius:6px; box-shadow:0 8px 0 rgba(0,0,0,.35); }
.A .stats h3 { margin:0 0 8px; font:700 18px var(--disp); }
.A .stats .row .v small { color:#2a7a2a; } .A .stats .row.up .v { color:#7a4a00; } .A .stats .row.off, .A .stats .row.off .v { color:#5d636f; }
.A .stats .grp + .grp { border-top-color:#7d838e; }
.A .win { left:380px; top:40px; width:1180px; height:720px; background:rgba(28,40,62,.94); border:3px solid #c9a24a; border-radius:6px; box-shadow:inset 0 0 0 2px #10182a, 0 10px 40px rgba(0,0,0,.6); padding:18px 24px; box-sizing:border-box; }
.A .win h1 { margin:0 0 4px; font:700 40px var(--disp); text-align:center; letter-spacing:.06em; }
.A .win .sub { text-align:center; font:600 14px var(--body); color:var(--dim); letter-spacing:.14em; text-transform:uppercase; margin-bottom:14px; }
.A .moves { display:grid; grid-template-columns:1fr 1fr; gap:14px 34px; }
.A .itemsBox { margin-top:16px; padding-top:12px; border-top:2px solid rgba(201,162,74,.5); }
.A .itemsBox h3 { margin:0 0 8px; font:700 16px var(--disp); color:var(--gold); }
.A .bar { left:380px; top:782px; width:1180px; display:flex; justify-content:flex-end; gap:14px; }
/* ---- B : Holocure v4 : une rangée centrée [Statistiques] [PAUSE] [Capacités] ; ouvrir une zone fait glisser PAUSE ---- */
.B .rowB { left:40px; right:40px; top:60px; bottom:60px; display:flex; justify-content:center; align-items:flex-start; gap:40px; }
.B .panel { flex:none; width:300px; margin-top:90px; background:#25344a; border:3px solid #c9a24a; border-radius:6px; box-shadow:inset 0 0 0 2px #10182a, 0 8px 0 rgba(0,0,0,.35), 0 10px 40px rgba(0,0,0,.5); box-sizing:border-box; padding:26px 30px 34px; display:flex; flex-direction:column; align-items:center; gap:14px; }
.B .panel h1 { margin:0 0 6px; font:700 46px var(--disp); letter-spacing:.06em; }
.B .panel .stg { margin:-10px 0 8px; font:600 14px var(--body); color:var(--dim); letter-spacing:.12em; text-transform:uppercase; }
.B .panel .btn { width:220px; font:700 20px var(--disp); letter-spacing:.06em; border-radius:8px; padding:10px 0; box-shadow:inset 0 -4px 0 rgba(0,0,0,.25); color:var(--ink); box-sizing:border-box; }
.B .panel .btn.main { background:var(--gold); color:#1a1a1a; border-color:#fff1b8; }
.B .panel .btn.green { background:#3e9a4a; border-color:#a6f0a0; } .B .panel .btn.blue { background:#2448c8; border-color:#9fb8ff; }
.B .panel .btn.grey { background:#9aa0a8; color:#1d2230; border-color:#5e6470; } .B .panel .btn.red { background:#c8402a; border-color:#ffb08a; }
.B .panel .btn.on { box-shadow:inset 0 -4px 0 rgba(0,0,0,.25), 0 0 0 3px #fff; }
/* Statistiques (gauche) : portrait, PV, stats sur une colonne */
.B .stats { flex:none; width:440px; align-self:stretch; background:rgba(16,24,40,.88); border:3px solid #c9a24a; border-radius:6px; box-shadow:inset 0 0 0 2px #10182a, 0 10px 40px rgba(0,0,0,.5); padding:18px 22px; box-sizing:border-box; } /* cadre bleu foncé à contour doré */
.B .stats .head { display:grid; grid-template-columns:120px 1fr; gap:16px; align-items:center; }
.B .stats .pf { width:120px; height:120px; border:4px solid #fff; border-radius:6px; overflow:hidden; box-shadow:0 5px 0 rgba(0,0,0,.4); } .B .stats .pf img { width:100%; height:100%; }
.B .stats .head b { display:block; font:700 30px var(--disp); } .B .stats .head span { font:11px var(--num); color:var(--gold); }
.B .stats .hp { display:flex; align-items:center; gap:8px; margin-top:10px; } .B .stats .hp i { display:block; width:140px; height:14px; border:2px solid #fff; background:linear-gradient(90deg, #6fe07a 81%, #1a2a1a 81%); } .B .stats .hp span { font:10px var(--num); white-space:nowrap; }
.B .stats .st { margin-top:20px; } .B .stats .st .row { border-bottom:2px solid rgba(255,255,255,.35); padding:4px 0; font-size:16px; } .B .stats .st .grp + .grp { border-top:0; margin-top:10px; padding-top:0; }
/* Capacités (droite) */
.B .caps { flex:0 1 720px; min-width:0; align-self:stretch; background:rgba(12,24,38,.9); border:3px solid #bfe6ff; border-radius:6px; padding:18px 22px; box-sizing:border-box; }
.B .caps h3 { margin:0 0 12px; font:700 20px var(--disp); color:#bfe6ff; letter-spacing:.06em; }
.B .caps .moves { display:grid; grid-template-columns:1fr 1fr; gap:12px 22px; }
.B .caps .itemsBox { margin-top:14px; padding-top:10px; border-top:2px solid rgba(191,230,255,.35); }
.B .keys { right:24px; bottom:14px; font:11px var(--num); color:#dfe8f0; }
/* ---- C : Temtem / Megabonk ---- */
.C .title { left:0; right:0; top:24px; text-align:center; } .C .title h1 { margin:0; font:700 54px var(--disp); letter-spacing:.08em; text-shadow:0 4px 0 rgba(0,0,0,.6); }
.C .title .stage { display:inline-block; margin-top:6px; padding:6px 22px; border:2px solid #e0802a; background:rgba(20,12,6,.6); font:700 18px var(--disp); color:#ffb060; } .C .title .stage small { display:block; font:600 13px var(--body); color:#ffd6a0; }
.C .btns { right:30px; top:30px; display:flex; flex-direction:column; gap:10px; width:220px; }
.C .card { background:linear-gradient(170deg, #3a4f6e, #263652); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.5); padding:16px 20px; box-sizing:border-box; }
.C .stat { left:40px; top:200px; width:440px; clip-path:polygon(0 0, 54% 0, 57% 22px, 100% 22px, 100% 100%, 0 100%); padding-top:30px; }
.C .stat .head { display:grid; grid-template-columns:84px 1fr; gap:14px; align-items:center; margin-bottom:12px; }
.C .stat .pf { width:84px; height:84px; border-radius:50%; overflow:hidden; border:3px solid rgba(255,255,255,.3); background:#6a9a80; } .C .stat .pf img { width:100%; height:100%; }
.C .stat .head b { display:block; font:800 24px var(--body); } .C .stat .head span { font:600 14px var(--body); color:#9fd8ff; }
.C .stat .st { display:grid; grid-template-columns:1fr 1fr; gap:0 18px; } .C .stat .st .grp + .grp { margin-top:0; padding-top:0; border:0; }
.C .stat .st .row { font-size:14px; } .C .stat .st .row img { width:20px; height:20px; }
.C .caps { left:510px; top:200px; width:830px; height:660px; }
.C .caps h3, .C .stat h3 { margin:0 0 10px; font:700 17px var(--body); color:#9fd8ff; letter-spacing:.06em; text-transform:uppercase; }
.C .caps .moves { display:grid; grid-template-columns:1fr 1fr; gap:12px 20px; }
.C .caps .itemsBox { margin-top:14px; padding-top:10px; border-top:1px solid rgba(255,255,255,.18); }
</style>
</head>
<body>
<div class="bg"></div><div class="veil"></div>
<script src="../selection/icons.js"></script>
<script src="hud-assets.js"></script>
<script src="move-icons.js"></script>
<script>
const Q = new URLSearchParams(location.search), V = (Q.get("v") || "a").toUpperCase(); document.body.className = V;
const T = { plante:"#3f8f3a", poison:"#7a3a98" };
// Herbizarre N.10, 1:46 : capacités (niveau actuel) et descriptions de chaque niveau (MOVES.desc du jeu)
const PMOVES = [
  ["tranchherbe", "Tranch'Herbe", "plante", 5, ["Deux feuilles tournent autour de toi.", "+1 feuille.", "Orbite plus large, dégâts +30 %.", "+1 feuille, rotation plus rapide.", "+2 feuilles."]],
  ["fouetlianes", "Fouet Lianes", "plante", 3, ["Deux lianes fouettent l'ennemi le plus proche et repoussent ceux autour.", "Lianes plus longues.", "Dégâts +40 %.", "Coups plus rapides.", "Fouette aussi un second groupe d'ennemis dans ton dos."]],
  ["poudretoxik", "Poudre Toxik", "poison", 2, ["Un nuage toxique reste 2 s autour de toi et empoisonne les ennemis qui le traversent.", "Nuage plus large, poison plus long.", "Dégâts du poison +40 %.", "Un nuage toutes les 4,5 s.", "Le nuage te suit et dure 3 s."]],
  ["lancesoleil", "Lance-Soleil", "plante", 4, ["Charge 1 s puis tire un rayon géant qui traverse tout l'écran.", "Rayon plus large.", "Dégâts +40 %.", "Charge plus rapide (0,6 s), recharge plus courte.", "Deux rayons en V."]],
  ["dansepetale", "Danse Pétale", "plante", 1, ["Une tornade de pétales fonce vers les groupes d'ennemis, les aspire et les blesse.", "Tornade plus large.", "Dégâts +40 %.", "Une tornade toutes les 4,5 s.", "Deux tornades à la fois."]],
  ["vampigraine", "Vampigraine", "plante", 2, ["Plante une graine sur un ennemi : elle lui vole des PV pendant 5 s et te soigne.", "+1 graine.", "Drain et soin +40 %.", "+1 graine, recharge plus rapide.", "+2 graines."]],
];
const PITEMS = [["depipe", "Dé Pipé", 1, 2], ["pvplus", "PV Plus", 3, 5], ["loupe", "Loupe", 2, 5], ["restes", "Restes", 2, 5], ["veste", "Veste de Combat", 1, 5], ["carbone", "Carbone", 4, 5]];
// stats en cours de partie : départ + évolution + objets ramassés (même liste que la sélection du Pokémon)
const STATS = [
  [["pvplus", "PV max", "138", "+90"], ["restes", "Régénération", "1,2/s", "+0,8"], ["veste", "Armure", "−1/coup"], ["rappel", "Rappel", "–"]],
  [["carbone", "Attaque", "+48 %"], ["lentilscope", "Critique", "–"], ["vivegriffe", "Recharge", "–"], ["depipe", "Projectiles", "+1"]],
  [["mouchoir", "Vitesse", "150"], ["loupe", "Zone", "+20 %"], ["poudrevite", "Vit. projectiles", "–"], ["lumargile", "Durée", "–"]],
  [["aimant", "Attraction", "–"], ["multiexp", "Expérience", "–"], ["miel", "Malédiction", "–"], [null, "Relances", "–", null, "🎲"]],
];
const statsHtml = () => `<div class="st">${STATS.map(g => `<div class="grp">${g.map(([it, n, v, plus, em]) => `<div class="row${v === "–" ? " off" : plus || /[+−]/.test(v) ? " up" : ""}">${it ? `<img src="${ICONS[it]}" alt="">` : `<span class="em">${em}</span>`}<span>${n}</span><span class="v">${v}${plus ? `<small>(${plus})</small>` : ""}</span></div>`).join("")}</div>`).join("")}</div>`;
const movesHtml = () => `<div class="moves">${PMOVES.map(([id, n, t, lv, d]) => `<div class="mv" data-id="${id}" style="--t:${T[t]}"><div class="ic"></div><div><h4>${n} <em>N.${lv}/5</em></h4><ol>${d.map((txt, i) => `<li class="${i < lv ? "on" : ""}"><b>${i + 1}</b><span>${txt}</span></li>`).join("")}</ol></div></div>`).join("")}</div>`;
const itemsHtml = () => `<div class="items">${PITEMS.map(([id, n, lv, max]) => `<span class="it"><img src="${ICONS[id]}" alt="">${n} <em>${lv}/${max}</em></span>`).join("")}</div>`;
const el = (html, cls) => { const d = document.createElement("div"); d.className = "abs " + cls; d.innerHTML = html; document.body.appendChild(d); return d; };
if (V === "A") { // Vampire+ : stats à gauche, grande fenêtre centrale (capacités niveau par niveau + objets), boutons en bas
  el(`<h3>Statistiques</h3>${statsHtml()}`, "stats");
  el(`<h1>PAUSE</h1><div class="sub">Herbizarre N.10 · Forêt de Jade · 01:46</div>${movesHtml()}<div class="itemsBox"><h3>Objets</h3>${itemsHtml()}</div>`, "win");
  el(`<span class="btn">Options</span><span class="btn red">Quitter la partie</span><span class="btn main">Reprendre</span>`, "bar");
}
if (V === "B") { // à l'ouverture : PAUSE seul au centre ; Statistiques à gauche et Capacités à droite s'ouvrent dans la même rangée
  const ST = Q.get("st") === "1", CAP = Q.get("cap") === "1";
  el((ST ? `<div class="stats"><div class="head"><div class="pf"><img class="px" src="${PORTRAIT_HERBIZARRE}" alt=""></div><div><b>Herbizarre</b><span>N.10</span><div class="hp"><i></i><span>112 / 138</span></div></div></div>${statsHtml()}</div>` : "")
    + `<div class="panel"><h1>PAUSE</h1><div class="stg">Forêt de Jade · 01:46</div><span class="btn main">Reprendre</span><span class="btn green${CAP ? " on" : ""}">Capacités</span><span class="btn blue${ST ? " on" : ""}">Statistiques</span><span class="btn grey">Options</span><span class="btn red">Quitter</span></div>`
    + (CAP ? `<div class="caps"><h3>CAPACITÉS</h3>${movesHtml()}<div class="itemsBox">${itemsHtml()}</div></div>` : ""), "rowB");
  el(`VALIDER : ENTRÉE  |  REPRENDRE : ÉCHAP`, "keys");
}
if (V === "C") { // Temtem / Megabonk : titre + niveau en haut, boutons à droite, fiche Statut et carte Capacités
  el(`<h1>EN PAUSE</h1><div class="stage">Forêt de Jade<small>Chapitre 1 · 01:46</small></div>`, "title");
  el(`<span class="btn main">Reprendre</span><span class="btn">Options</span><span class="btn red">Quitter</span>`, "btns");
  el(`<div class="head"><div class="pf"><img class="px" src="${PORTRAIT_HERBIZARRE}" alt=""></div><div><b>Herbizarre</b><span>N.10 · PV 112 / 138</span></div></div><h3>Statut</h3>${statsHtml()}`, "card stat");
  el(`<h3>Capacités</h3>${movesHtml()}<div class="itemsBox"><h3>Objets</h3>${itemsHtml()}</div>`, "card caps");
}
document.querySelectorAll(".mv").forEach(m => m.querySelector(".ic").appendChild(moveIcon(m.dataset.id, 32, 16)));
</script>
</body>
</html>
