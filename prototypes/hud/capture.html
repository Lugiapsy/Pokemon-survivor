<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Capture du fond de jeu</title>
<style>html, body { margin:0; background:#000; overflow:hidden; } iframe, img { position:fixed; inset:0; width:1600px; height:900px; border:0; }</style>
</head>
<body>
<!-- Lance une vraie partie (Bulbizarre, Forêt de Jade), sans l'interface, puis fige l'image du jeu -->
<iframe id="g" src="../../index.html"></iframe>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
const f = document.getElementById("g");
f.addEventListener("load", async () => {
  const w = f.contentWindow, d = f.contentDocument, $ = id => d.getElementById(id);
  const key = (code, k, t) => (t || w).dispatchEvent(new w.KeyboardEvent("keydown", { code, key:k, bubbles:true }));
  const cmd = async c => { key("Backquote", "²"); await wait(100); $("dbgInput").value = c; key("Enter", "Enter", $("dbgInput")); await wait(1500); };
  await wait(800);
  $("homeSolo").click(); await wait(300); $("pickGo").click(); await wait(300); $("sGo").click();
  await wait(4500);
  await cmd("god mode"); await cmd("speed 4");
  await wait(Number(new URLSearchParams(location.search).get("t") || 9000));
  const st = d.createElement("style"); st.textContent = "body > *:not(canvas#game) { display:none !important; }"; d.head.appendChild(st);
  key("Escape", "Escape"); await wait(300); // pause : l'image ne bouge plus
  const img = new Image(); img.src = $("game").toDataURL("image/png"); await img.decode();
  document.body.appendChild(img); f.remove(); document.title = "pret";
});
</script>
</body>
</html>
