<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Icônes des capacités</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&family=Rubik:wght@400;600;800&display=swap">
<style>
html, body { margin:0; width:1600px; background:#13221a; color:#f4f1e4; font-family:"Rubik", sans-serif; font-variant-ligatures:none; }
main { padding:26px 34px 30px; }
h1 { margin:0 0 4px; font:800 32px "Rubik", sans-serif; color:#f6c845; }
p.sub { margin:0 0 14px; color:#b9c4b0; font-size:15px; }
section { margin-top:14px; }
h2 { margin:0 0 8px; font:800 19px "Rubik", sans-serif; display:flex; align-items:center; gap:10px; border-bottom:2px solid #3c5a46; padding-bottom:4px; }
h2 i { width:14px; height:14px; border-radius:3px; background:var(--c); }
.grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:8px 14px; }
.it { display:flex; align-items:center; gap:12px; }
.ic { width:52px; height:52px; flex:none; border-radius:7px; display:grid; place-items:center; border:2px solid #6a5a34; background:linear-gradient(160deg, var(--c), #0e1612); }
.ic canvas { width:40px; height:40px; image-rendering:pixelated; }
.r32 .ic { width:60px; height:60px; } .r32 .ic canvas { width:48px; height:48px; }
.it b { font:700 16px "Rubik", sans-serif; } .it small { display:block; font:600 12px "Rubik", sans-serif; color:#b9c4b0; }
</style>
</head>
<body>
<main>
<h1>Icônes des capacités</h1>
<p class="sub">59 capacités du jeu (v174), pixel art 16×16 agrandi ×2,5, fond de la couleur du type. Les attaques partagées entre plusieurs Pokémon gardent la même icône.</p>
<div id="out"></div>
</main>
<script src="move-icons.js"></script>
<script>
const TC = { plante:"#3f8f3a", poison:"#7a3a98", feu:"#c8582a", eau:"#2f6ab8", electrik:"#b8960a", dragon:"#5a3ec0", normal:"#7a7460", fee:"#c0508c", vol:"#6a58b8", combat:"#a03a2a", glace:"#3a98b0" };
const GROUPS = [
  ["Plante", "plante", [["tranchherbe","Tranch'Herbe","plante","Bulbizarre"],["fouetlianes","Fouet Lianes","plante","Bulbizarre"],["poudretoxik","Poudre Toxik","poison","Bulbizarre, Germignon"],["lancesoleil","Lance-Soleil","plante","Bulbizarre"],["dansepetale","Danse Pétale","plante","Bulbizarre"],["vampigraine","Vampigraine","plante","Bulbizarre"],["feuillemagik","Feuillemagik","plante","Germignon"],["synthese","Synthèse","plante","Germignon"],["tapisfleuri","Tapis Fleuri","plante","Germignon"],["tempeteflorale","Tempête Florale","plante","Germignon"]]],
  ["Feu", "feu", [["flammeche","Flammèche","feu","Salamèche"],["feufollet","Feu Follet","feu","Salamèche"],["lanceflammes","Lance-Flammes","feu","Salamèche"],["deflagration","Déflagration","feu","Salamèche"],["danseflamme","Danse Flamme","feu","Salamèche"],["rouefeu","Roue de Feu","feu","Héricendre"],["nitrocharge","Nitrocharge","feu","Héricendre"],["rebondifeu","Rebondifeu","feu","Héricendre"],["eruption","Éruption","feu","Héricendre"]]],
  ["Eau", "eau", [["pistolet","Pistolet à O","eau","Carapuce"],["bullesdo","Bulles d'O","eau","Carapuce"],["surf","Surf","eau","Carapuce"],["cascade","Cascade","eau","Carapuce"],["hydrocanon","Hydrocanon","eau","Carapuce"],["siphon","Siphon","eau","Carapuce"],["machouille","Mâchouille","eau","Kaiminus"],["crocsgivre","Crocs Givre","glace","Kaiminus"],["hydroqueue","Hydroqueue","eau","Kaiminus"],["aquabreche","Aqua-Brèche","eau","Kaiminus"]]],
  ["Électrik", "electrik", [["eclair","Éclair","electrik","Pichu"],["tonnerre","Tonnerre","electrik","Pichu"],["cageeclair","Cage-Éclair","electrik","Pichu"],["bouleelek","Boule Élek","electrik","Pichu"],["fatalfoudre","Fatal-Foudre","electrik","Pichu"]]],
  ["Dragon", "dragon", [["dracorage","Draco-Rage","dragon","Minidraco"],["ouragan","Ouragan","dragon","Minidraco"],["dracoqueue","Draco-Queue","dragon","Minidraco"],["ultralaser","Ultralaser","normal","Minidraco"],["dansedraco","Danse Draco","dragon","Minidraco, Salamèche"]]],
  ["Normal", "normal", [["combogriffe","Combo-Griffe","normal","Miaouss, Évoli"],["jackpot","Jackpot","normal","Miaouss, Évoli"],["morsure","Morsure","normal","Miaouss, Évoli"],["viveattaque","Vive-Attaque","normal","Miaouss, Évoli"],["grozyeux","Groz'Yeux","normal","Miaouss, Évoli"],["tranche","Tranche","normal","Miaouss, Évoli"],["meteores","Météores","normal","Évoli"],["brouillard","Brouillard","normal","Héricendre"],["protection","Protection","normal","Germignon"]]],
  ["Togepi (Fée, Vol, Combat)", "fee", [["ventfeerique","Vent Féérique","fee","Togepi"],["lamedair","Lame d'Air","vol","Togepi"],["aurasphere","Aurasphère","combat","Togepi"],["eclatmagique","Éclat Magique","fee","Togepi"],["metronome","Métronome","normal","Togepi"]]],
  ["Mew (Métronome 1 à 6)", "normal", [1, 2, 3, 4, 5, 6].map(n => ["metro" + n, "Métronome " + n, "normal", "Mew"])],
];
const out = document.getElementById("out"), RES = +(new URLSearchParams(location.search).get("res") || 16);
if (RES === 32) { document.querySelector("h1").textContent = "Icônes des capacités · 32×32"; document.querySelector(".sub").textContent = "Mêmes dessins qu'en 16×16, tracés sur une grille 32×32 (deux fois plus fins) avec un ombrage : haut des formes éclairci, bas assombri. Agrandies ×1,5."; document.body.classList.add("r32"); }
document.fonts.load('16px "Press Start 2P"').finally(() => {
  for (const [title, t, list] of GROUPS) {
    const sec = document.createElement("section"); sec.innerHTML = `<h2 style="--c:${TC[t]}"><i></i>${title}</h2><div class="grid"></div>`; out.appendChild(sec);
    for (const [id, name, type, who] of list) {
      const it = document.createElement("div"); it.className = "it";
      const ic = document.createElement("div"); ic.className = "ic"; ic.style.setProperty("--c", TC[type]); ic.appendChild(moveIcon(id, RES === 32 ? 48 : 40, RES));
      it.appendChild(ic); it.insertAdjacentHTML("beforeend", `<div><b>${name}</b><small>${who}</small></div>`);
      sec.querySelector(".grid").appendChild(it);
    }
  }
  document.title = "pret " + document.body.scrollHeight;
});
</script>
</body>
</html>
