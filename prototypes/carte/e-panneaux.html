<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E · Panneaux</title>
<link rel="stylesheet" href="common.css">
<style>
/* E · Panneaux (carte blanche) : l'écran est découpé en bandes verticales penchées ; celle choisie s'élargit et montre tout */
:root { --reg:#e5483b; }
body { height:100vh; overflow:hidden; background:#0d0d12; }
.view { position:fixed; inset:0; display:flex; flex-direction:column; transition:opacity .3s; }
.view.off { opacity:0; pointer-events:none; }
.bar { display:flex; align-items:center; gap:14px; padding:14px 22px; z-index:2; }
.bar button { background:none; border:2px solid #fff4; border-radius:99px; padding:6px 14px; font:700 13px var(--body); }
.bar h1 { margin:0; font:800 22px var(--body); letter-spacing:.12em; text-transform:uppercase; }
.bar h1 em { font-style:normal; color:var(--reg); }
.bar .cnt { margin-left:auto; font:600 13px var(--body); color:var(--ink-dim); }
.panels { flex:1; display:flex; gap:6px; padding:0 34px 60px; min-height:0; }
.pan { position:relative; flex:1; min-width:0; padding:0; border:0; background:#000; transform:skewX(-7deg); overflow:hidden; transition:flex-grow .45s cubic-bezier(.2, .8, .2, 1), filter .3s; outline:3px solid transparent; outline-offset:-3px; }
.pan .bgi { position:absolute; inset:0 -60px; background-size:cover; background-position:18% 30%; transform:skewX(7deg); transition:transform .45s, filter .3s; }
.pan::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.35) 50%, rgba(0,0,0,.9) 100%); pointer-events:none; }
.pan .un { position:absolute; inset:0; transform:skewX(7deg); z-index:1; }
.pan .num { position:absolute; top:18px; left:60%; transform:translateX(-50%); font:16px var(--num); color:#fff; text-shadow:0 2px 0 #000; transition:.3s; }
.pan .vname { position:absolute; left:42%; bottom:30px; transform:translateX(-50%); writing-mode:vertical-rl; rotate:180deg; white-space:nowrap; font:800 22px var(--body); letter-spacing:.08em; text-transform:uppercase; text-shadow:0 2px 6px #000; transition:opacity .2s; }
.pan .tro { position:absolute; top:48px; left:58%; transform:translateX(-50%); font-size:18px; }
.pan .full { position:absolute; left:8%; right:8%; bottom:28px; opacity:0; transform:translateY(16px); transition:opacity .25s .1s, transform .3s .1s; pointer-events:none; text-align:left; }
.pan .full h2 { margin:0; font:800 clamp(28px, 3.4vw, 48px)/1 var(--body); text-transform:uppercase; letter-spacing:.02em; text-shadow:0 3px 10px #000; }
.pan .full .kind { display:inline-block; margin:8px 0 10px; font:700 12px var(--body); letter-spacing:.12em; text-transform:uppercase; background:var(--reg); padding:4px 10px; border-radius:3px; }
.pan .full p { margin:0 0 10px; max-width:520px; font:15px/1.45 var(--body); color:#eee; text-shadow:0 1px 4px #000; }
.pan .full .line { display:flex; flex-wrap:wrap; gap:6px 18px; font:600 13px var(--body); color:#ddd; margin-bottom:8px; }
.pan .full .mons { display:flex; flex-wrap:wrap; background:rgba(0,0,0,.45); border-radius:6px; padding:2px 4px; max-width:600px; }
.pan .full .lbl { font:700 11px var(--body); letter-spacing:.12em; text-transform:uppercase; color:#bbb; margin:8px 0 2px; }
.pan .full .go { pointer-events:auto; margin-top:12px; padding:12px 26px; border:0; background:#fff; color:#111; font:800 16px var(--body); letter-spacing:.1em; text-transform:uppercase; clip-path:polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
.pan .full .go:hover { background:var(--accent); }
.pan .full .need { display:inline-block; margin-top:8px; padding:8px 12px; background:rgba(120,20,30,.85); font:700 14px var(--body); }
.pan.sel { flex-grow:7; outline-color:#fff; }
.pan.sel .bgi { transform:skewX(7deg) scale(1.04); background-position:center; }
.pan.sel .vname, .pan.sel .tro { opacity:0; }
.pan.sel .num { left:8%; transform:none; font-size:20px; color:var(--reg); }
.pan.sel .full { opacity:1; transform:none; }
.pan:not(.sel):hover { filter:brightness(1.25); }
.pan.locked .bgi { filter:grayscale(1) brightness(.35); }
.pan.locked .num { color:#aaa; }
.pan.soon .bgi { background:repeating-linear-gradient(-45deg, #15151c 0 12px, #1b1b24 12px 24px); }
.pan.soon .vname { color:#555; }
.pan .lkbig { position:absolute; top:44%; left:50%; transform:translate(-50%, -50%); font-size:28px; color:#ccc; }
.pan.sel .lkbig { display:none; }
/* Régions */
#vReg .panels { gap:10px; padding-top:6px; }
#vReg .pan { transform:skewX(-10deg); }
#vReg .pan .bgi, #vReg .pan .un { transform:skewX(10deg); }
#vReg .pan.sel { flex-grow:1.8; }
#vReg .pan .rname { position:absolute; left:10%; bottom:40px; text-align:left; }
#vReg .pan .rname small { font:700 13px var(--body); letter-spacing:.2em; text-transform:uppercase; color:var(--c); }
#vReg .pan .rname b { display:block; font:800 clamp(44px, 7vw, 96px)/.95 var(--body); text-transform:uppercase; text-shadow:0 4px 16px #000; }
#vReg .pan .rname p { margin:10px 0 0; max-width:380px; font:15px/1.4 var(--body); color:#ddd; text-shadow:0 1px 4px #000; }
#vReg .pan .rname .pg { display:flex; gap:4px; margin-top:12px; } #vReg .pan .rname .pg i { width:22px; height:6px; background:#fff3; } #vReg .pan .rname .pg i.on { background:var(--c); }
#vReg .pan .masc { position:absolute; right:8%; bottom:30px; }
#vReg .pan.locked .masc { filter:brightness(0); }
#vReg .pan .lkr { position:absolute; left:10%; top:28px; padding:6px 12px; background:rgba(0,0,0,.7); font:700 13px var(--body); border-left:4px solid var(--c); }
.keys { position:fixed; left:22px; bottom:14px; z-index:2; }
@media (max-width: 800px) {
  body { overflow:auto; height:auto; } .view { position:static; } .view.off { display:none; }
  .panels { flex-direction:column; padding:0 16px 80px; gap:8px; }
  .pan, #vReg .pan { transform:none; flex:none; height:58px; transition:height .35s; } .pan .bgi, .pan .un, #vReg .pan .bgi, #vReg .pan .un { transform:none; inset:0; }
  .pan.sel { height:auto; min-height:420px; } #vReg .pan, #vReg .pan.sel { height:46vh; }
  .pan .vname { writing-mode:horizontal-tb; rotate:none; left:60px; bottom:auto; top:16px; transform:none; font-size:17px; }
  .pan .num { left:22px; transform:none; top:20px; } .pan .tro { left:auto; right:14px; top:16px; transform:none; } .pan .lkbig { left:auto; right:16px; top:28px; transform:translateY(-50%); font-size:20px; }
  .bar h1 { font-size:15px; letter-spacing:.06em; } .bar { flex-wrap:wrap; }
  .pan.sel .full { position:relative; left:auto; right:auto; bottom:auto; padding:56px 16px 16px; }
  .keys { display:none; }
}
</style>
</head>
<body>
<section class="view" id="vReg">
  <div class="bar"><button type="button" id="back1">← Pokémon</button><h1>Choisis ta <em>région</em></h1></div>
  <div class="panels" id="regs"></div>
</section>
<section class="view off" id="vLv">
  <div class="bar"><button type="button" id="back2">← Régions</button><h1 id="lvTitle"></h1><span class="cnt" id="cnt"></span></div>
  <div class="panels" id="pans"></div>
</section>
<div class="keys"><span><kbd>←→</kbd>Choisir</span><span><kbd>Entrée</kbd>Jouer</span><span><kbd>Échap</kbd>Retour</span></div>
<script src="../../src/assets/sprites.js"></script>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
let REG = "kanto";
const regPans = REGIONS.map(R => {
  const open = regOpen(R.id), ls = regLevels(R.id), n = R.plan || ls.length, done = ls.filter(isDone).length;
  const b = document.createElement("button"); b.type = "button"; b.className = "pan" + (open ? "" : " locked"); b.style.setProperty("--c", R.col);
  b.innerHTML = `<span class="bgi" style="background-image:url(${R.img})"></span><span class="un">
    ${open ? "" : `<span class="lkr"><i class="lockIco"></i> ${R.lock}</span>`}<span class="masc"></span>
    <span class="rname"><small>${R.chap}</small><b>${R.name}</b><p>${R.blurb}</p><span class="pg">${Array.from({ length:n }, (_, k) => `<i class="${k < done ? "on" : ""}"></i>`).join("")}</span></span></span>`;
  canvasFor(b.querySelector(".masc"), 200, 200, (g, t) => drawMon(g, R.mascot, 100, 196, 4, 0, t, open));
  $("regs").appendChild(b); return b;
});
function stepReg() {
  $("vReg").classList.remove("off"); $("vLv").classList.add("off");
  listNav(regPans, { start:REGIONS.findIndex(R => R.id === REG), scroll:false,
    onConfirm:i => regOpen(REGIONS[i].id) ? stepLv(REGIONS[i].id) : toast(`🔒 ${REGIONS[i].lock}`), onBack:() => toast("← Retour au choix du Pokémon") });
}
function stepLv(r) {
  REG = r; const R = REGIONS.find(x => x.id === r); document.documentElement.style.setProperty("--reg", R.col);
  $("vReg").classList.add("off"); $("vLv").classList.remove("off");
  $("lvTitle").innerHTML = `<em>${R.name}</em> · Choisis ton niveau`;
  const ls = regLevels(r); $("cnt").textContent = `${ls.filter(isDone).length} / ${R.plan || ls.length} terminés`;
  const slots = regSlots(r); $("pans").innerHTML = "";
  const pans = slots.map(lv => {
    const b = document.createElement("div"); b.setAttribute("role", "button"); const open = isOpen(lv), hid = isHidden(lv), d = best(lv);
    b.className = "pan" + (open ? "" : " locked") + (lv.soon ? " soon" : "");
    b.innerHTML = `<span class="bgi" ${lv.soon ? "" : `style="background-image:url(${lv.img})"`}></span><span class="un">
      <span class="num">${lv.soon ? "?" : String(lvLabel(lv)).padStart(2, "0")}</span>${d ? `<span class="tro">🏆</span>` : ""}
      ${open || lv.soon ? "" : `<span class="lkbig"><i class="lockIco"></i></span>`}<span class="vname">${shownName(lv)}</span>
      <span class="full"><h2>${shownName(lv)}</h2>${lv.soon ? `<p>Ce niveau n'existe pas encore.</p>` : `<span class="kind">${hid ? "Niveau secret" : lv.kind} · ${lv.time === "5 salles" ? "5 salles" : "⏱ " + lv.time}</span>
        <p>${hid ? "Un lieu mystérieux… Seuls les Maîtres de la Ligue savent où il se cache." : lv.desc}</p>
        ${d ? `<div class="line"><span>🏆 Terminé</span><span>💥 ${d.kos} K.O.</span><span>⭐ N.${d.lvl}</span></div>` : ""}
        ${hid ? "" : `<div class="lbl">Pokémon sauvages</div><div class="mons m1"></div><div class="lbl">Boss</div><div class="mons m2"></div>`}
        ${open ? `<button class="go" type="button">▶ Jouer</button>` : `<span class="need"><i class="lockIco"></i> ${unlockText(lv)}</span>`}`}</span></span>`;
    if (!lv.soon && !hid) { lv.mons.forEach((n, i) => b.querySelector(".m1").appendChild(monIcon(n, isSeen(lv, i), 38))); lv.boss.forEach(([nm, n]) => b.querySelector(".m2").appendChild(monIcon(n, isDone(lv), 42))); }
    const go = b.querySelector(".go"); if (go) go.addEventListener("click", e => { e.stopPropagation(); launch(lv); });
    $("pans").appendChild(b); return b;
  });
  listNav(pans, { start:r === "kanto" ? Math.min(WINS, 8) : 0, scroll:matchMedia("(max-width: 800px)").matches,
    onConfirm:i => isOpen(slots[i]) ? launch(slots[i]) : refuse(slots[i]), onBack:stepReg });
}
$("back1").addEventListener("click", () => toast("← Retour au choix du Pokémon"));
$("back2").addEventListener("click", stepReg);
stepReg();
</script>
</body>
</html>
