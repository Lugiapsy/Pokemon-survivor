<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Capture des cartes</title>
<style>html, body { margin:0; background:#000; color:#fff; font:14px sans-serif; overflow:hidden; } iframe { position:fixed; inset:0; width:1280px; height:720px; border:0; } #log { position:fixed; right:0; top:0; background:#000c; padding:6px; z-index:9; }</style>
</head>
<body>
<!-- Lance une vraie partie sur chaque niveau (Bulbizarre, god mode), masque l'interface et envoie une image du jeu
     au petit serveur de réception (port 8136). Le localStorage est remis comme avant à la fin. -->
<div id="log">…</div>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
const log = t => document.getElementById("log").textContent = t;
let SHOTS = [[0], [1], [2], [3], [4], [5], [6, "a"], [6, "b"], [6, "c"], [6, "d"], [6, "e"], [7], [8], [9]];
const Q = new URLSearchParams(location.search).get("seul"); if (Q) SHOTS.splice(0, SHOTS.length, ...Q.split(",").map(x => [6, x])); // ?seul=f,g,h : refaire l'Oiseau Légendaire
const N = new URLSearchParams(location.search).get("niv"); if (N) SHOTS.splice(0, SHOTS.length, ...N.split(",").map(x => [+x - 1])); // ?niv=5 : refaire un niveau
const saved = JSON.stringify(Object.entries(localStorage));
async function shoot([lv, mapK]) {
  const f = document.createElement("iframe"); f.src = "../../index.html?" + Math.random(); document.body.appendChild(f);
  await new Promise(r => f.onload = r);
  const w = f.contentWindow, d = f.contentDocument, $ = id => d.getElementById(id);
  const key = (code, k, t) => (t || w).dispatchEvent(new w.KeyboardEvent("keydown", { code, key:k, bubbles:true }));
  const cmd = async c => { key("Backquote", "²"); await wait(100); $("dbgInput").value = c; key("Enter", "Enter", $("dbgInput")); await wait(700); };
  await wait(800);
  await cmd("qqq"); key("Escape", "Escape"); await wait(200);
  $("menuTheme").value = "neocrizis"; $("menuTheme").dispatchEvent(new w.Event("change")); // écran du niveau de Neo (sa carte de route sert à choisir le niveau)
  $("homeSolo").click(); await wait(300);
  if (lv >= 9) { d.querySelector('.rtReg[data-r="johto"]').click(); await wait(300); }
  d.querySelectorAll(".rtRoute .rtNode:not(.soon)")[lv >= 9 ? lv - 9 : lv].click();
  await wait(300); $("sGo").click();
  await wait(2500);
  await cmd("god mode");
  await wait(+(new URLSearchParams(location.search).get("t") || 7000));
  if (location.search.includes("voir")) { f.style.zIndex = 5; return "voir"; }
  const st = d.createElement("style"); st.textContent = "body > *:not(canvas#game) { display:none !important; }"; d.head.appendChild(st);
  if (!location.search.includes("sanspause")) { key("Escape", "Escape"); await wait(400); }
  const src = $("game"), c = document.createElement("canvas"); c.width = 960; c.height = 540;
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  const name = `lv${lv + 1}${mapK != null ? "-" + mapK : ""}.jpg`;
  await fetch("http://127.0.0.1:8136/" + name, { method:"POST", body:c.toDataURL("image/jpeg", .86) });
  f.remove();
  return name;
}
(async () => {
  for (const s of SHOTS) { log("capture " + s.join("-")); log("ok " + await shoot(s)); }
  localStorage.clear(); for (const [k, v] of JSON.parse(saved)) localStorage.setItem(k, v);
  document.title = "pret"; log("pret");
})();
</script>
</body>
</html>
