<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D · Cartouches</title>
<link rel="stylesheet" href="common.css">
<style>
/* D · Cartouches (carte blanche) : 1) chaque région est une cartouche de Game Boy debout, 2) les niveaux sont des bandes empilées, celle choisie s'ouvre */
:root { --bg:#1b1c22; --cream:#ece4cc; --ink2:#2b2b33; }
body { min-height:100vh; background:radial-gradient(circle at 50% 120%, #3a3550 0%, var(--bg) 60%); background-attachment:fixed; }
body::before { content:""; position:fixed; inset:0; pointer-events:none; background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.4px); background-size:6px 6px; }
.view { position:relative; z-index:1; transition:opacity .3s; }
.view.off { display:none; }
h1 { margin:0; padding:26px 16px 0; text-align:center; font:700 30px var(--display); letter-spacing:.08em; color:var(--cream); }
h1 small { display:block; font:500 15px var(--body); letter-spacing:0; color:#9a98b0; margin-top:4px; }
/* Cartouche */
.carts { display:flex; justify-content:center; align-items:flex-end; gap:min(70px, 6vw); padding:50px 16px 120px; min-height:calc(100vh - 90px); }
.cart { --body:#c8312a; --dk:#8e1d18; --lt:#e85a4a; position:relative; width:min(270px, 40vw); aspect-ratio:270/310; padding:0; border:0; background:none; transition:transform .25s cubic-bezier(.3, 1.4, .5, 1), filter .25s; }
.cart .shell { position:absolute; inset:0; background:linear-gradient(90deg, var(--dk), var(--body) 12%, var(--lt) 50%, var(--body) 88%, var(--dk)); border-radius:10px 10px 6px 6px;
  clip-path:polygon(0 0, 86% 0, 100% 9%, 100% 100%, 0 100%); box-shadow:inset 0 -10px 0 rgba(0,0,0,.25); }
.cart .ridges { position:absolute; left:10%; right:24%; top:3%; height:7%; background:repeating-linear-gradient(90deg, rgba(0,0,0,.25) 0 4px, transparent 4px 10px); border-radius:3px; }
.cart .label { position:absolute; left:9%; right:9%; top:15%; bottom:17%; background:var(--cream); border-radius:6px 6px 4px 4px; padding:7px; display:flex; flex-direction:column; box-shadow:inset 0 0 0 2px rgba(0,0,0,.15); }
.cart .label .art { position:relative; flex:1; overflow:hidden; border-radius:3px; background:#000; }
.cart .label .art img { width:100%; height:100%; object-fit:cover; }
.cart .label .art .masc { position:absolute; left:50%; bottom:0; transform:translateX(-50%); }
.cart .label b { margin-top:6px; text-align:center; font:700 clamp(15px, 2.2vw, 22px) var(--display); color:var(--dk); letter-spacing:.06em; }
.cart .label small { text-align:center; font:600 10px var(--body); color:#6b6650; letter-spacing:.1em; text-transform:uppercase; }
.cart .arrow { position:absolute; left:50%; bottom:5%; transform:translateX(-50%); width:0; height:0; border:8px solid transparent; border-top:10px solid rgba(0,0,0,.3); border-bottom:0; }
.cart .sticker { position:absolute; right:-6%; top:34%; z-index:2; transform:rotate(8deg); background:#f6d13a; color:#1a1a1a; font:700 11px/1.25 var(--body); padding:8px 10px; border-radius:6px; box-shadow:0 3px 10px #0008; max-width:60%; text-align:left; }
.cart.johto { --body:#c9a227; --dk:#8a6a12; --lt:#ecd36a; }
.cart.locked { filter:grayscale(.9) brightness(.55); }
.cart.locked .masc { filter:brightness(0); }
.cart.sel { transform:translateY(-26px) rotate(-2deg); filter:drop-shadow(0 18px 24px rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(246,200,69,.35)); }
.cart.locked.sel { filter:grayscale(.9) brightness(.65) drop-shadow(0 18px 24px rgba(0,0,0,.6)); }
.cart.insert { transform:translateY(120vh) !important; transition:transform .45s cubic-bezier(.6, 0, .9, .4); }
.cart .prog { position:absolute; left:9%; right:9%; bottom:8%; display:flex; gap:3px; }
.cart .prog i { flex:1; height:6px; border-radius:2px; background:rgba(0,0,0,.3); } .cart .prog i.on { background:#f6f0d8; }
/* Étape 2 */
.lvWrap { display:grid; grid-template-columns:200px minmax(0, 1fr); gap:24px; width:min(1200px, calc(100% - 32px)); margin:20px auto 80px; }
.mini { position:sticky; top:20px; align-self:start; display:flex; flex-direction:column; align-items:center; gap:10px; }
.mini .cart { width:170px; } .mini .cart .label b { font-size:15px; } .mini .cart .label small { font-size:8px; } .mini .cart:hover { transform:translateY(-6px); }
.mini p { margin:0; font:600 13px var(--body); color:#9a98b0; text-align:center; }
.strips { display:flex; flex-direction:column; gap:8px; }
.strip { position:relative; display:flex; flex-direction:column; height:64px; flex-shrink:0; border:2px solid #3a3a48; border-radius:10px; overflow:hidden; text-align:left; background:#22232c; transition:height .3s cubic-bezier(.2, .8, .2, 1), border-color .2s; }
.strip .bgi { position:absolute; inset:0; background-size:cover; background-position:center 40%; opacity:.55; transition:opacity .3s; }
.strip .bgi::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(20,20,28,.95) 0%, rgba(20,20,28,.55) 45%, rgba(20,20,28,.85) 100%); }
.strip > * { position:relative; }
.strip .hd { display:grid; grid-template-columns:64px 1fr auto; align-items:center; height:60px; flex-shrink:0; padding-right:18px; }
.strip .n { align-self:stretch; display:grid; place-items:center; font:12px var(--num); background:rgba(0,0,0,.45); color:var(--cream); }
.strip .t { padding-left:16px; font:700 22px var(--display); letter-spacing:.03em; }
.strip .t small { margin-left:10px; font:500 13px var(--body); color:#c9c6d8; letter-spacing:0; }
.strip .end { font:600 13px var(--body); color:#c9c6d8; display:flex; gap:10px; align-items:center; }
.strip.locked .bgi { filter:grayscale(1); opacity:.25; }
.strip.locked .t { color:#8a8898; }
.strip.soon { border-style:dashed; background:transparent; }
.strip.soon .t { color:#666; }
.strip.sel { border-color:var(--cream); }
.strip .open { display:none; }
.strip.sel.big { height:410px; }
.strip.sel.big .bgi { opacity:.2; filter:blur(3px); }
.strip.sel.big .open { display:grid; flex:1; min-height:0; grid-template-columns:minmax(0, 1.05fr) minmax(0, 1fr); gap:20px; padding:4px 18px 16px 16px; }
.open .shot { position:relative; border-radius:8px; overflow:hidden; border:2px solid #fff3; align-self:stretch; background:#000; }
.open .shot img { width:100%; height:100%; object-fit:cover; display:block; }
.open .shot .maps { position:absolute; left:8px; bottom:8px; display:flex; gap:6px; }
.open .shot .maps img { width:64px; height:36px; border:2px solid #fff; border-radius:4px; }
.open .txt { display:flex; flex-direction:column; gap:7px; min-height:0; overflow:hidden; }
.open p { margin:0; font:15px/1.45 var(--body); color:#e6e4f0; }
.open h4 { margin:2px 0 0; font:700 11px var(--body); text-transform:uppercase; letter-spacing:.1em; color:#9a98b0; }
.open .mons { display:flex; flex-wrap:wrap; }
.open .go { margin-top:auto; align-self:flex-start; display:flex; align-items:center; gap:10px; padding:10px 22px; border:0; border-radius:99px; background:var(--cream); color:#1a1a1a; font:700 18px var(--display); letter-spacing:.06em; box-shadow:0 4px 0 #8a8268; }
.open .go::before { content:""; border:8px solid transparent; border-left:12px solid #c8312a; border-right:0; }
.open .need { margin-top:auto; padding:10px 12px; border-radius:8px; background:#3a2228; color:#ffc4b8; font:600 14px var(--body); }
.keys { position:fixed; left:16px; bottom:14px; z-index:2; }
@media (max-width: 800px) {
  .lvWrap { grid-template-columns:1fr; } .mini { position:static; flex-direction:row; } .mini .cart { width:90px; } .mini .cart .label b { font-size:11px; } .mini .cart .label small, .mini .cart .sticker { display:none; }
  .strip.sel.big { height:auto; } .strip .hd { padding-right:12px; } .strip.sel.big .open { grid-template-columns:1fr; padding-right:16px; } .open .shot { aspect-ratio:16/9; }
  .strip .t { font-size:17px; } .strip .t small { display:none; } .keys { display:none; } .carts { align-items:center; }
}
</style>
</head>
<body>
<section class="view" id="vReg">
  <h1>CHOISIS TA CARTOUCHE<small>Chaque région est une aventure à part</small></h1>
  <div class="carts" id="carts"></div>
</section>
<section class="view off" id="vLv">
  <div class="lvWrap"><div class="mini" id="mini"></div><div class="strips" id="strips"></div></div>
</section>
<div class="keys"><span><kbd>↑↓</kbd>Choisir</span><span><kbd>Entrée</kbd>Jouer</span><span><kbd>Échap</kbd>Changer de cartouche</span></div>
<script src="../../src/assets/sprites.js"></script>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
let REG = "kanto";
function cartridge(R, size = 1) {
  const open = regOpen(R.id), ls = regLevels(R.id), n = R.plan || ls.length, done = ls.filter(isDone).length;
  const b = document.createElement("button"); b.type = "button"; b.className = `cart ${R.id}${open ? "" : " locked"}`;
  b.innerHTML = `<span class="shell"></span><span class="ridges"></span><span class="label"><span class="art"><img src="${R.img}" alt=""><span class="masc"></span></span>
    <b>POKÉMON ${R.name.toUpperCase()}</b><small>${R.chap} · Survivor</small></span><span class="arrow"></span>
    <span class="prog">${Array.from({ length:n }, (_, k) => `<i class="${k < done ? "on" : ""}"></i>`).join("")}</span>${open ? "" : `<span class="sticker"><i class="lockIco"></i> ${R.lock}</span>`}`;
  const sz = Math.round(110 * size); canvasFor(b.querySelector(".masc"), sz, sz, (g, t) => drawMon(g, R.mascot, sz / 2, sz - 2, 2.2 * size, 0, t, open));
  return b;
}
const carts = REGIONS.map(R => { const b = cartridge(R); $("carts").appendChild(b); return b; });
function stepReg() {
  $("vReg").classList.remove("off"); $("vLv").classList.add("off"); carts.forEach(c => c.classList.remove("insert"));
  listNav(carts, { start:REGIONS.findIndex(R => R.id === REG), scroll:false,
    onConfirm:i => { const R = REGIONS[i]; if (!regOpen(R.id)) return toast(`🔒 ${R.lock}`); carts[i].classList.add("insert"); setTimeout(() => stepLv(R.id), 420); },
    onBack:() => toast("← Retour au choix du Pokémon") });
}
function stepLv(r) {
  REG = r; $("vReg").classList.add("off"); $("vLv").classList.remove("off"); scrollTo(0, 0);
  const R = REGIONS.find(x => x.id === r), mini = $("mini"); mini.innerHTML = "";
  const mc = cartridge(R, .7); mc.title = "Changer de cartouche"; mc.addEventListener("click", stepReg); mini.appendChild(mc);
  const ls = regLevels(r); mini.insertAdjacentHTML("beforeend", `<p>${ls.filter(isDone).length} / ${R.plan || ls.length} terminés<br>Clique la cartouche pour changer de région</p>`);
  const slots = regSlots(r); $("strips").innerHTML = "";
  const strips = slots.map(lv => {
    const b = document.createElement("div"); b.className = "strip" + (isOpen(lv) ? "" : " locked") + (lv.soon ? " soon" : ""); b.setAttribute("role", "button");
    const d = best(lv);
    b.innerHTML = `${lv.soon || isHidden(lv) ? "" : `<span class="bgi" style="background-image:url(${lv.img})"></span>`}<div class="hd"><span class="n">${lv.soon ? "?" : lvLabel(lv)}</span>
      <span class="t">${shownName(lv)}${!lv.soon && isOpen(lv) ? `<small>${lv.kind} · ${lv.time}</small>` : ""}</span>
      <span class="end">${lv.soon ? "En construction" : d ? "🏆 Terminé" : isOpen(lv) ? "Nouveau" : `<i class="lockIco"></i> ${unlockText(lv)}`}</span></div><div class="open"></div>`;
    $("strips").appendChild(b); return b;
  });
  listNav(strips, { start:r === "kanto" ? Math.min(WINS, 8) : 0,
    onFocus:i => { strips.forEach(s => s.classList.remove("big")); if (!slots[i].soon) { strips[i].classList.add("big"); fill(strips[i], slots[i]); } },
    onConfirm:i => isOpen(slots[i]) ? launch(slots[i]) : refuse(slots[i]), onBack:stepReg });
}
function fill(el, lv) {
  const o = el.querySelector(".open"), open = isOpen(lv), hid = isHidden(lv), d = best(lv);
  if (o.dataset.ok) return; o.dataset.ok = 1;
  o.innerHTML = `<div class="shot">${hid ? "" : `<img src="${lv.img}" alt="" style="${open ? "" : "filter:grayscale(1) brightness(.4)"}">`}
      ${lv.maps && open ? `<span class="maps">${lv.maps.map(m => `<img src="${m[1]}" title="${m[0]}" alt="">`).join("")}</span>` : ""}</div>
    <div class="txt"><p>${hid ? "Un lieu mystérieux… Seuls les Maîtres de la Ligue savent où il se cache." : lv.desc}</p>
      ${hid ? "" : `<h4>Pokémon sauvages</h4><div class="mons m1"></div><h4>Boss${lv.event && open ? " et rencontre rare" : ""}</h4><div class="mons m2"></div>`}
      ${d ? `<p style="color:#cfe9c0">🏆 Record : ${d.kos} K.O. · N.${d.lvl}</p>` : ""}
      ${open ? `<button class="go" type="button">JOUER</button>` : `<div class="need"><i class="lockIco"></i> ${unlockText(lv)} pour débloquer ce niveau.</div>`}</div>`;
  if (!hid) { lv.mons.forEach((n, i) => o.querySelector(".m1").appendChild(monIcon(n, isSeen(lv, i), 36)));
    lv.boss.forEach(([nm, n]) => o.querySelector(".m2").appendChild(monIcon(n, isDone(lv), 40))); if (lv.event && open) o.querySelector(".m2").appendChild(monIcon(lv.event[1], isDone(lv), 40)); }
  const go = o.querySelector(".go"); if (go) go.addEventListener("click", e => { e.stopPropagation(); launch(lv); });
}
stepReg();
</script>
</body>
</html>
