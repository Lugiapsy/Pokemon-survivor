<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · Carrousel</title>
<link rel="stylesheet" href="common.css">
<style>
/* B · Carrousel : 1) deux grandes cartes verticales (régions), 2) carrousel de cartes verticales (niveaux), façon Temtem Swarm */
:root { --teal:#46e0e8; --teal-dk:#1d6f78; --frame:#2a3340; }
body { min-height:100vh; overflow:hidden; background:#130d24; }
.sky { position:fixed; inset:0; background:radial-gradient(ellipse at 20% 30%, rgba(140,40,160,.35), transparent 50%), radial-gradient(ellipse at 80% 70%, rgba(40,60,160,.35), transparent 55%), radial-gradient(ellipse at 50% 100%, rgba(200,60,120,.25), transparent 60%), #120c22; }
.sky::after { content:""; position:absolute; inset:0; background-image:radial-gradient(1px 1px at 10% 20%, #fff8, transparent), radial-gradient(1px 1px at 30% 70%, #fff6, transparent), radial-gradient(1.5px 1.5px at 70% 15%, #fff9, transparent), radial-gradient(1px 1px at 85% 55%, #fff7, transparent), radial-gradient(1px 1px at 50% 40%, #fff5, transparent); background-size:420px 300px; }
.view { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; transition:opacity .3s, transform .3s; }
.view.off { opacity:0; pointer-events:none; transform:scale(.97); }
.title { margin-top:26px; display:flex; align-items:center; gap:18px; font:800 24px var(--body); letter-spacing:.05em; text-transform:uppercase; }
.title::before, .title::after { content:""; width:min(200px, 18vw); height:3px; background:linear-gradient(90deg, transparent, var(--teal)); border-radius:2px; }
.title::after { transform:scaleX(-1); }
.plaque { margin-top:18px; min-width:min(420px, 80vw); padding:10px 28px; text-align:center; font:800 30px var(--body); text-transform:uppercase; letter-spacing:.04em;
  background:linear-gradient(#1c5d68, #134049); border:3px solid var(--teal); clip-path:polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%); box-shadow:0 0 30px rgba(70,224,232,.35); }
.plaque small { display:block; font:600 13px var(--body); letter-spacing:.02em; text-transform:none; color:#bfeef2; }
/* Carte verticale commune (région ou niveau) */
.tcard { position:relative; flex-shrink:0; padding:0; border:0; background:none; transition:transform .25s, filter .25s, opacity .25s; }
.tcard .in { position:absolute; inset:10px 10px 22px; overflow:hidden; background:#000; border:4px solid #5c6b78; clip-path:polygon(0 0, 100% 0, 100% 100%, 62% 100%, 50% calc(100% - 22px), 38% 100%, 0 100%); }
.tcard .in img { width:100%; height:100%; object-fit:cover; }
.tcard .corner { position:absolute; top:0; width:44px; height:58px; background:var(--frame); border:3px solid #b9c6cf; }
.tcard .corner.l { left:0; border-right:0; border-bottom:0; clip-path:polygon(0 0, 100% 0, 100% 30%, 30% 30%, 30% 100%, 0 100%); }
.tcard .corner.r { right:0; border-left:0; border-bottom:0; clip-path:polygon(0 0, 100% 0, 100% 100%, 70% 100%, 70% 30%, 0 30%); }
.tcard .notch { position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:80px; height:44px; background:#26313b; clip-path:polygon(50% 0, 100% 100%, 0 100%); display:grid; place-items:end center; padding-bottom:4px; font:11px var(--num); color:#dfe; }
.tcard .lock { position:absolute; left:50%; top:46%; transform:translate(-50%, -50%); width:84px; height:94px; display:grid; place-items:center; font-size:38px; color:#cfd6da;
  background:rgba(40,46,54,.85); clip-path:polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.tcard.locked .in img, .tcard.locked canvas { filter:grayscale(1) brightness(.55) contrast(1.1); }
.tcard.sel .in { border-color:var(--teal); box-shadow:0 0 0 2px var(--teal); }
.tcard.sel { filter:drop-shadow(0 0 22px rgba(70,224,232,.55)); }
.tcard.sel .notch { background:var(--teal-dk); }
.tcard.done::after { content:"🏆"; position:absolute; top:18px; right:18px; z-index:2; font-size:20px; background:rgba(0,0,0,.6); border-radius:50%; width:34px; height:34px; display:grid; place-items:center; }
/* Étape 1 : régions */
.regs { flex:1; display:flex; align-items:center; justify-content:center; gap:min(60px, 5vw); padding:10px 16px 90px; }
.regs .tcard { width:min(300px, 40vw); height:min(470px, 60vh); }
.regs .tcard .name { position:absolute; left:10px; right:10px; top:18px; z-index:1; text-align:center; font:800 34px var(--body); text-transform:uppercase; text-shadow:0 3px 10px #000, 0 2px 0 #000; }
.regs .tcard .name small { display:block; font:700 12px var(--body); letter-spacing:.1em; color:#cfe; }
.regs .tcard .mascot { position:absolute; left:50%; bottom:70px; transform:translateX(-50%); z-index:1; }
.regs .tcard .prog { position:absolute; left:26px; right:26px; bottom:44px; z-index:1; height:8px; background:rgba(0,0,0,.6); border-radius:4px; overflow:hidden; }
.regs .tcard .prog i { display:block; height:100%; background:var(--teal); }
.regs .tcard:not(.sel) { transform:scale(.92); opacity:.85; }
/* Étape 2 : carrousel des niveaux */
.track { position:relative; flex:1; width:100%; display:flex; align-items:center; }
.belt { display:flex; align-items:center; gap:18px; transition:transform .35s cubic-bezier(.2, .8, .2, 1); padding:0 50vw; }
.belt .tcard { width:220px; height:310px; }
.belt .tcard.sel { width:270px; height:420px; }
.belt .tcard:not(.sel) { opacity:.9; }
.belt .tcard.far { opacity:.35; }
.belt .tcard.soon .in { background:repeating-linear-gradient(45deg, #1d2430 0 10px, #232c3a 10px 20px); }
.belt .tcard.soon .in::after { content:"Bientôt"; position:absolute; inset:0; display:grid; place-items:center; font:800 20px var(--body); color:#7a8796; text-transform:uppercase; }
.info { width:min(980px, calc(100% - 32px)); margin:0 auto 70px; display:grid; grid-template-columns:1.2fr 1fr; gap:18px; background:rgba(20,26,40,.82); border:2px solid #3a4a5a; border-radius:10px; padding:14px 18px; min-height:140px; }
.info p { margin:0 0 8px; font:15px/1.45 var(--body); color:#dfe6ee; }
.info .facts { display:flex; flex-wrap:wrap; gap:8px; }
.info .facts span { font:600 12px var(--body); background:#22303f; border:1px solid #3f5468; border-radius:99px; padding:4px 10px; }
.info .facts .ok { background:#1d4a3a; border-color:#3aa070; }
.info .facts .no { background:#4a1d24; border-color:#a03a48; }
.info h4 { margin:0 0 4px; font:700 12px var(--body); color:var(--teal); text-transform:uppercase; letter-spacing:.08em; }
.info .mons { display:flex; flex-wrap:wrap; }
.info .row2 { display:flex; gap:16px; align-items:flex-start; }
.keys { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); }
.keys kbd { border-radius:50%; }
.backBtn { position:fixed; left:18px; top:22px; z-index:5; background:rgba(0,0,0,.5); border:2px solid #5c6b78; border-radius:8px; padding:8px 12px; font:700 14px var(--body); }
@media (max-width: 760px) {
  .belt .tcard { width:140px; height:210px; } .belt .tcard.sel { width:180px; height:280px; }
  .info { grid-template-columns:1fr; margin-bottom:60px; } .plaque { font-size:22px; } .title { font-size:18px; margin-top:64px; } .keys { display:none; }
  .regs .tcard .name { font-size:24px; }
}
</style>
</head>
<body>
<div class="sky"></div>
<button class="backBtn" type="button" id="back">← Retour</button>
<section class="view" id="vReg">
  <div class="title">Choix de la région</div>
  <div class="regs" id="regs"></div>
</section>
<section class="view off" id="vLv">
  <div class="title" id="lvTitle">Kanto</div>
  <div class="plaque" id="plaque"></div>
  <div class="track"><div class="belt" id="belt"></div></div>
  <div class="info" id="info"></div>
</section>
<div class="keys"><span><kbd>←→</kbd>Choisir</span><span><kbd>A</kbd>Sélectionner</span><span><kbd>B</kbd>Retour</span></div>
<script src="../../src/assets/sprites.js"></script>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
const frame = (inner, extra = "") => `<span class="corner l"></span><span class="corner r"></span><span class="in">${inner}</span>${extra}`;
let REG = "kanto", step = "reg";
// Étape 1
const regCards = REGIONS.map(R => {
  const b = document.createElement("button"); b.type = "button"; const open = regOpen(R.id), ls = regLevels(R.id), done = ls.filter(isDone).length;
  b.className = "tcard" + (open ? "" : " locked");
  b.innerHTML = frame(`<img src="${R.img}" alt="">`, `<span class="name"><small>${R.chap}</small>${R.name}</span>${open ? "" : `<span class="lock"><i class="lockIco"></i></span>`}
    <span class="prog"><i style="width:${done / (R.plan || ls.length) * 100}%"></i></span><span class="notch">${done}/${R.plan || ls.length}</span>`);
  const m = document.createElement("span"); m.className = "mascot"; b.appendChild(m);
  canvasFor(m, 150, 150, (g, t) => drawMon(g, R.mascot, 75, 140, 3, 0, t, open, !open));
  $("regs").appendChild(b); return b;
});
function stepReg() {
  step = "reg"; $("vReg").classList.remove("off"); $("vLv").classList.add("off");
  listNav(regCards, { start:REGIONS.findIndex(R => R.id === REG), onFocus:i => {},
    onConfirm:i => regOpen(REGIONS[i].id) ? stepLv(REGIONS[i].id) : toast(`🔒 ${REGIONS[i].lock}`), onBack:() => toast("← Retour au choix du Pokémon") });
}
// Étape 2
function stepLv(r) {
  REG = r; step = "lv"; $("vReg").classList.add("off"); $("vLv").classList.remove("off");
  const R = REGIONS.find(x => x.id === r); $("lvTitle").textContent = `${R.name} · Choix du niveau`;
  const slots = regSlots(r); $("belt").innerHTML = "";
  const cards = slots.map(lv => {
    const b = document.createElement("button"); b.type = "button";
    b.className = "tcard" + (isOpen(lv) ? "" : " locked") + (lv.soon ? " soon" : "") + (isDone(lv) ? " done" : "");
    b.innerHTML = frame(lv.soon ? "" : `<img src="${lv.img}" alt="">`, `${isOpen(lv) || lv.soon ? "" : `<span class="lock"><i class="lockIco"></i></span>`}<span class="notch">${lv.soon ? "?" : lvLabel(lv)}</span>`);
    $("belt").appendChild(b); return b;
  });
  const center = i => { const c = cards[i], belt = $("belt"); belt.style.transform = `translateX(${belt.parentElement.clientWidth / 2 - (c.offsetLeft + c.offsetWidth / 2)}px)`;
    cards.forEach((el, k) => el.classList.toggle("far", Math.abs(k - i) > 2)); };
  const nav = listNav(cards, { start:r === "kanto" ? Math.min(WINS, 8) : 0,
    onFocus:i => { requestAnimationFrame(() => center(i)); info(slots[i]); },
    onConfirm:i => isOpen(slots[i]) ? launch(slots[i]) : refuse(slots[i]), onBack:stepReg, scroll:false }); // le carrousel se déplace tout seul
}
function info(lv) {
  const open = isOpen(lv), hid = isHidden(lv), d = best(lv);
  $("plaque").innerHTML = `${lv.soon ? "Bientôt" : shownName(lv)}<small>${lv.soon ? "Niveau en construction" : `Niveau ${lvLabel(lv)}${hid ? "" : " · " + lv.kind}`}</small>`;
  if (lv.soon) { $("info").innerHTML = `<div><p>Ce niveau de Johto n'existe pas encore. Reviens plus tard !</p></div>`; return; }
  $("info").innerHTML = `<div><p>${hid ? "Un lieu mystérieux… Seuls les Maîtres de la Ligue savent où il se cache." : lv.desc}</p>
      <div class="facts"><span>⏱ ${lv.time === "5 salles" ? "5 salles, sans chrono" : lv.time}</span>
      ${open ? (d ? `<span class="ok">🏆 Terminé · ${d.kos} K.O.</span>` : `<span>Pas encore terminé</span>`) : `<span class="no">🔒 ${unlockText(lv)}</span>`}
      ${lv.event && open ? `<span>✨ ${lv.event[2]}</span>` : ""}</div></div>
    <div>${hid ? "" : `<h4>Pokémon sauvages</h4><div class="mons" id="mons"></div><div class="row2"><div><h4>Boss</h4><div class="mons" id="boss"></div></div></div>`}</div>`;
  if (!hid) { lv.mons.forEach((n, i) => $("mons").appendChild(monIcon(n, isSeen(lv, i), 36))); lv.boss.forEach(([nm, n]) => $("boss").appendChild(monIcon(n, isDone(lv), 44))); }
}
addEventListener("resize", () => { if (step === "lv" && NAV) NAV.focus(NAV.cur, false); });
$("back").addEventListener("click", () => step === "lv" ? stepReg() : toast("← Retour au choix du Pokémon"));
stepReg();
</script>
</body>
</html>
